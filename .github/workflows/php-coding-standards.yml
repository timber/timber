name: PHP coding standards

on:
  push:
    branches:
      - master
      - 2.x
    paths:
      - "**.php"
      - "**composer.json"
  pull_request:
    branches:
      - master
      - 2.x
    paths:
      - "**.php"
      - "**composer.json"
    types:
      - opened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  php-cs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          PHP_TOOLS: cs2pr

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.php
          safe_output: true

      # ECS 13.3 dropped its checkstyle format (ecsphp/ecs-src#74), so its JSON report is
      # converted for cs2pr, which annotates the pull request and fails the job on violations.
      - name: Run coding standards
        if: steps.changed-files.outputs.all_changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          ./vendor/bin/ecs check --output-format=json $CHANGED_FILES \
            | jq -r --arg ws "$PWD/" -f .github/scripts/ecs-checkstyle.jq \
            | cs2pr
